migrate:
  enabled: true
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400

  image:
    repository: tazama-cms-migrate
    tag: "latest"
    pullPolicy: IfNotPresent

  command:
    - sh
    - /home/app/migrate.sh

  resources: {}

voila:
  enabled: true
  replicaCount: 1

  image:
    repository: tazama-cms-voila
    tag: "latest"
    pullPolicy: IfNotPresent

  env:
    CASE_MGMT_BACKEND_URL: 'http://{{ include "cms.componentFullname" (dict "root" . "component" "backend") }}:3090'
    VOILA_PORT: "8866"
    CMS_FRONTEND_ORIGIN: http://10.10.80.16:5175

  service:
    type: ClusterIP
    port: 8866
    targetPort: 8866

  resources: {}
