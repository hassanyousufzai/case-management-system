apiVersion: v2
name: cms
description: Tazama Case Management System and dependencies
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: postgresql
    alias: postgres
    version: "18.7.6"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: postgres.enabled

  - name: valkey
    alias: valkey
    version: "0.10.0"
    repository: "https://valkey.io/valkey-helm/"
    condition: valkey.enabled

  - name: nats
    alias: nats
    version: "2.14.2"
    repository: "https://nats-io.github.io/k8s/helm/charts/"
    condition: nats.enabled

  - name: couchdb
    alias: couchdb
    version: "4.6.3"
    repository: "https://apache.github.io/couchdb-helm"
    condition: couchdb.enabled

  - name: flowable
    alias: flowable
    version: "7.1.0"
    repository: "https://flowable.github.io/helm/"
    condition: flowable.enabled

  - name: keycloak
    version: "25.2.0"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: keycloak.enabled
