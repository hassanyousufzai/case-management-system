{{- if and .Values.app.enabled .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cms.componentFullname" (dict "root" . "component" "backend") }}
  labels:
    {{- include "cms.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "cms.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cms.selectorLabels" (dict "root" . "component" "backend") | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "cms.componentFullname" (dict "root" . "component" "app-env") }}
            - secretRef:
                name: {{ include "cms.componentFullname" (dict "root" . "component" "app-secret") }}
          {{- if .Values.backend.publicKey }}
          volumeMounts:
            - name: auth-public-key
              mountPath: {{ .Values.backend.publicKeyMountPath }}
              subPath: public.pem
              readOnly: true
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- if .Values.backend.publicKey }}
      volumes:
        - name: auth-public-key
          secret:
            secretName: {{ include "cms.componentFullname" (dict "root" . "component" "app-secret") }}
            items:
              - key: public.pem
                path: public.pem
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cms.componentFullname" (dict "root" . "component" "backend") }}
  labels:
    {{- include "cms.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "cms.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
